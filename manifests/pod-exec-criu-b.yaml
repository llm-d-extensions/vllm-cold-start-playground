# Pod B for the cross-pod CRIU restore arm: does an image dumped in one pod
# restore in a DIFFERENT one? Every restore in reports/criu-cuda-checkpoint.txt
# was measured back into the pod that produced the dump (see that report's
# "WHAT WAS NOT MEASURED" close: "whether any of these images restores into a
# DIFFERENT pod than the one that dumped it (all reuse here is same-pod)").
# This manifest, plus scripts/criu-setup.sh run in both pods, is what makes
# that comparison possible instead of just assumed.
#
# Derived from manifests/pod-exec-criu.yaml -- read that file first, and read
# it again after editing this one: it carries the load-bearing arithmetic
# (the 384Gi requirement, the fork/VLLM_WORKER_MULTIPROC_METHOD trade-off) that
# this file inherits unchanged. Only what differs from it is called out below;
# everything else -- caches, security context, fork rationale, the 384Gi
# comment -- is copied verbatim because it is still true here. It is NOT
# regenerated by a script the way pod-exec-2gpu.yaml is from pod-exec.yaml,
# because pod-exec-criu.yaml's differences from its own parent are structural
# (an extra emptyDir, privileged securityContext) rather than a single
# find/replace, and this file's differences from pod-exec-criu.yaml are a
# third, independent set (name, node pinning, image-store volume) -- there is
# no single mechanical transform that produces all three files from one
# source, so re-diff by hand against pod-exec-criu.yaml rather than trusting
# this comment to stay exhaustive.
#
# Differences from manifests/pod-exec-criu.yaml:
#
#   1. metadata.name is vllm-coldstart-b, NOT vllm-coldstart. Every other
#      manifest in this directory deliberately keeps the name vllm-coldstart
#      so scripts/run-experiment.sh, `make exec` and the probe scripts find it
#      unchanged -- "applying one replaces the other" is the whole point of
#      that convention. This manifest breaks it on purpose: the cross-pod arm
#      needs pod A (vllm-coldstart, still running the dump side) and pod B
#      (this one, the restore side) to exist as two distinguishable objects,
#      even if only one is ever scheduled at a time -- see point 4. Giving it
#      the shared name would make `kubectl apply -f pod-exec-criu-b.yaml`
#      silently replace pod A mid-experiment, which is exactly the ambiguity
#      this whole exercise is trying to remove.
#
#      This is not free. reports/criu-raw/crosspod-predictions.txt:309-321
#      (read-only recon done specifically for this cross-pod question) notes
#      that pod-exec-criu.yaml's own convention of ALWAYS calling the pod
#      vllm-coldstart has a side effect nobody asked for on purpose: Kubernetes
#      sets a container's hostname to the pod name when none is set explicitly
#      (true here), so re-applying under the same name gives a restored
#      process a byte-identical hostname/UTS namespace to the one it was
#      dumped from, silently removing hostname/UTS as a cross-pod variable.
#      Naming this pod vllm-coldstart-b deliberately REOPENS that variable --
#      it is the price of the object-identity argument above, not a free
#      choice. Nothing in this repo has ever exercised a criu restore across a
#      hostname change; if a restore fails here in a way that would not make
#      sense for a same-name pod, check UTS/hostname-sensitive state (anything
#      that reads gethostname(), e.g. distributed rendezvous or logging
#      prefixes) before concluding the failure is about "different pod" in
#      general.
#
#   2. Node pinning is a placeholder, not a decision, because the experiment
#      needs BOTH a same-node arm (isolates "different pod" from "different
#      node/GPU/driver" -- if the restore then fails or behaves differently,
#      you know it is about the pod, not about landing on unfamiliar
#      hardware) and a different-node arm (the case that actually matters for
#      a real deployment, where a replica restoring an image will typically
#      NOT land back on the exact node that built it). Pod A's node was
#      pokprod-b93r39s1 (reports/criu-raw/environment.txt:5), 2x H100-80GB-HBM3.
#      For the same-node arm, uncomment nodeName below. For the different-node
#      arm, comment nodeSelector to just the GPU model instead (or point it at
#      a specific different node you have picked) -- but note the environment
#      report's whole premise is that criu, the plugin and cuda-checkpoint
#      must be byte-identical between the two pods regardless of which node
#      each lands on, which is what scripts/criu-setup.sh's driver-keyed cache
#      is for: a different node can mean a different driver build, and the
#      cache key will show that rather than hide it.
#
#      Candidate nodes, MEASURED via `kubectl get nodes -o json` and `kubectl
#      get pods -A -o wide` on 2026-09-0x (reports/criu-raw/crosspod-
#      predictions.txt:80-137; re-check occupancy immediately before running,
#      this is a snapshot, not a reservation):
#        same-node (B1)      : pokprod-b93r39s1 itself -- 3 of 6 GPUs free at
#                               recon time, same driver/kernel by construction.
#        different-node (B2) : pokprod-b93r39s2 (0 used, 8 free) or
#                               pokprod-b93r43s3 (0 used, 6 free) -- both
#                               reported the SAME driver (580.105.08) and
#                               kernel (5.14.0-570.64.1.el9_6.x86_64) as
#                               pokprod-b93r39s1, i.e. every driver-labeled
#                               node in the cluster agreed at recon time. A
#                               genuine driver-MISMATCH arm is not available
#                               on this cluster today; B2 as specified tests
#                               "different physical card, identical driver and
#                               kernel," which is a narrower claim than "any
#                               different node" -- say so in the report, don't
#                               round it up.
#      One risk is specific to landing on a DIFFERENT node and does not apply
#      to the same-node arm at all: /dev/nvidia-uvm and /dev/nvidia-uvm-tools
#      are commonly registered as dynamically-numbered misc character devices
#      at driver-module load time, so their major:minor CAN legitimately
#      differ across hosts even under an identical driver build, purely from
#      module-load order on that host's boot. Whether cuda_plugin.so's
#      device-vma restore path re-opens the named device (immune to this) or
#      validates the recorded device number against the live one (not immune)
#      is UNVERIFIED in this repo either way (crosspod-predictions.txt:323-
#      342) -- flag this to a reviewer before spending GPU time on B2
#      specifically; it does not threaten B1.
#   nodeName: pokprod-b93r39s1
#   # nodeSelector:
#   #   nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
#
#   3. The criu image store lives at /cache/criu-img -- a plain subdirectory
#      of the "cache" PVC mount this manifest already carries at /cache, not a
#      second volume or an emptyDir. manifests/pod-exec-criu.yaml
#      puts /criu on node-local nvme deliberately, because within ONE pod's
#      lifetime an emptyDir is fine and faster (649 MB/s write, 3900 MB/s read
#      -- reports/criu-raw/environment.txt:42-46). It is useless here: an
#      emptyDir dies with its pod, and the entire question this manifest exists
#      to test is "can a dump survive to a DIFFERENT pod", so the image must
#      outlive pod A's termination. scripts/criu-preboot.sh already reads
#      IMGROOT from the environment (default /criu/img) and every dump/restore
#      call in this repo's criu scripts goes through that variable or an
#      explicit -D/--img-dir, so no script change is needed -- only the mount.
#
#      Be honest about what this costs before trusting a restore-time number
#      measured against it: /cache is backed by Spectrum Scale (MEASURED,
#      `kubectl get pvc coldstart-cache -o json` / `kubectl get storageclass
#      ibm-spectrum-scale-fileset -o yaml`, reports/criu-raw/crosspod-
#      predictions.txt:140-153: storageClassName ibm-spectrum-scale-fileset,
#      provisioner spectrumscale.csi.ibm.com, fsType gpfs), a network/parallel
#      filesystem, not the /dev/nvme0n1p4 local SSD (3900 MB/s read,
#      reports/criu-raw/environment.txt:44-46) the 2.31s cache-cold restore in
#      this report's build was measured on. Two independent GPFS throughput
#      readings exist on this same volume and disagree by >10x depending on
#      access pattern (crosspod-predictions.txt:187-200): a single-stream dd
#      got 859 MB/s (docs/sleep-mode.md:652-655), while true O_DIRECT reads at
#      1/4/8/16 threads got 1.15/4.12/7.79/9.30 GiB/s (docs/experiments.md:
#      557-563). Neither is criu's own access pattern (page-file reads during
#      `criu restore`), so which applies here is INFERRED, not measured -- the
#      image is only 0.59 GiB for the recommended --stage server route, so
#      raw throughput at ANY of these rates is not the risk; per-request
#      latency on a network filesystem for a file this small (metadata
#      lookup, lock acquisition, first-open cost) is not captured by any of
#      these numbers and is the more plausible way a slower store eats the
#      result -- crosspod-predictions.txt:452-468 works the arithmetic: the
#      win goes to zero only if the sustained read rate for THIS image drops
#      below ~148 MB/s, ~26x under nvme and ~5.8x under even the slow
#      single-stream GPFS figure, so throughput alone should not zero it, but
#      only running the restore will show whether latency does. The whole
#      quantity being tested is (imports or weights carried by the image)
#      minus (restore cost), and restore cost is dominated by how fast the
#      image can be READ -- so a slower image store does not just add a
#      constant, it eats directly into the number the experiment is trying to
#      produce. If the cross-pod restore looks slower or the same as the
#      same-pod one, check whether that is the pod or the storage tier before
#      concluding anything about cross-pod portability. This is exactly why
#      the local-nvme /criu mount is kept below TOO (point 3a) -- so a
#      same-pod nvme-vs-PVC comparison can isolate the storage-tier effect on
#      its own, in one pod, before it gets tangled up with the cross-pod
#      question.
#
#   3a. The node-local /criu emptyDir from pod-exec-criu.yaml is kept, in
#       ADDITION to the PVC mount, specifically so a same-pod, same-image,
#       nvme-vs-PVC read-speed comparison is possible without needing a third
#       manifest: dump to /criu/img (nvme) and to /cache/criu-img (PVC) from
#       the same warmed process, or copy one image between the two roots, and
#       restore from each with cache eviction (the existing scripts' EVICT/
#       posix_fadvise DONTNEED path) to get a clean read-speed number per tier.
#
#   4. coldstart-cache (mounted at /cache, manifests/cache-pvc.yaml) is
#      ReadWriteOnce. Pod A already mounts it (manifests/pod-exec-criu.yaml),
#      so pod A MUST be deleted before pod B can bind it -- kubectl will leave
#      pod B Pending with a FailedAttachVolume/multi-attach event otherwise,
#      not silently share it. The two arms are therefore STRICTLY SEQUENTIAL:
#      build and dump in pod A, delete pod A, apply pod B, restore. There is no
#      concurrent variant of this experiment as specified, and switching the
#      PVC to RWX to remove that constraint would also remove the guarantee
#      that nothing else was writing /cache/criu-img while the dump was taken.
#      Mechanically this is a k8s/CSI attach/detach-controller policy, not a
#      GPFS physical limitation: the CSIDriver reports attachRequired=true
#      (crosspod-predictions.txt:142-151), so the controller manages one
#      VolumeAttachment per PV at a time and grants a new one (to a different
#      node) only after the old one releases, which happens automatically when
#      the pod holding it terminates -- consistent with GPFS itself being a
#      shared, multi-mount-capable filesystem underneath (StorageClass
#      parameter "shared": "true"). No attach/detach cycle has actually been
#      timed in this repo (that needs creating/deleting a pod, out of scope
#      for read-only recon), so the wall-clock cost of detach-then-reattach on
#      a DIFFERENT node -- relevant to the B2 arm specifically -- is an
#      unmeasured addition neither this manifest's comments nor
#      scripts/criu-setup.sh account for.
#
# Do not read this as a recommended serving shape, for all the reasons
# manifests/pod-exec-criu.yaml already gives (CAP_SYS_ADMIN over the node).
#
apiVersion: v1
kind: Pod
metadata:
  name: vllm-coldstart-b
  labels:
    app.kubernetes.io/part-of: llm-d-cold-start
    app.kubernetes.io/component: experiment
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  # See point 2 above: uncomment exactly one of these for the arm you are
  # running. Leaving both commented schedules onto whatever node the
  # scheduler picks, which is neither controlled arm -- do not run the
  # experiment that way and then label the result "same-node" or
  # "different-node".
  # nodeName: pokprod-b93r39s1
  # nodeSelector:
  #   nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  containers:
    - name: vllm
      # Pin a digest for anything you intend to compare across days: the vLLM
      # version is one of the strongest determinants of start time.
      image: vllm/vllm-openai:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c", "sleep infinity"]
      ports:
        - name: http
          containerPort: 8000
      env:
        # ---- probe wiring -------------------------------------------------
        # PYTHONPATH is set per-run by coldstart-run.sh, not here: leaving the
        # probe off the default path keeps `kubectl exec` shells clean and lets
        # --no-probe control runs measure the same container.
        - name: CS_PROBE_SRC
          value: /opt/coldstart-src
        - name: CS_OUT_DIR
          value: /var/log/coldstart
        # ---- caches: every one of these must be writable and *explicit* ----
        # An unset cache dir silently lands in $HOME, which on OpenShift's
        # restricted SCC is a read-only "/" for an arbitrary uid -- vLLM then
        # recompiles on every run and the experiment measures the wrong thing.
        - name: HOME
          value: /cache/home
        - name: HF_HOME
          value: /cache/hf
        - name: HF_HUB_CACHE
          value: /cache/hf/hub
        - name: XDG_CACHE_HOME
          value: /cache/xdg
        - name: VLLM_CACHE_ROOT
          value: /cache/vllm
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /cache/inductor
        - name: TRITON_CACHE_DIR
          value: /cache/triton
        - name: FLASHINFER_CACHE_DIR
          value: /cache/flashinfer
        # Older FlashInfer reads FLASHINFER_WORKSPACE_BASE instead; set both so
        # the cache lands on the PVC whichever release the image ships.
        - name: FLASHINFER_WORKSPACE_BASE
          value: /cache/flashinfer
        # Persist the memory-profiling result (the suggested --kv-cache-memory
        # value and the free-memory baseline) under $VLLM_CACHE_ROOT/startup_plan/,
        # keyed by a hardware+config fingerprint; later boots skip memory
        # profiling when the fingerprint matches and free memory is >= the
        # recorded baseline. Measured on 20260901-191644: r1 wrote
        # startup_plan_faaa0e6a718763db.json, r2 logged "Applying persisted
        # startup plan ... Memory profiling will be skipped" and spent 1.37s in
        # kvcache.determine_memory against r1's 2.01s -- so it is worth ~0.6s,
        # not the ~1.9s a cold-vs-warm reading suggests: most of the cold
        # determine_memory cost was the profile forward pass compiling, which
        # the torch.compile cache already covers. Never pays on the first boot
        # of a given fingerprint, and only pays at all because the plan lands
        # under VLLM_CACHE_ROOT on the PVC (which does make it cross-pod).
        - name: VLLM_ENABLE_STARTUP_PLAN
          value: "1"
        # ---- thread sizing --------------------------------------------------
        # torch/OpenMP size their pools from the *node's* core count, not the
        # cgroup quota: the traced run reached 193 threads under a 16-core
        # limit, which is why CPU/wall during imports was 1.42 rather than
        # ~1.0, and it produced cgroup throttling at only 1.4 cores of real
        # use. Keep this in step with resources.limits.cpu below.
        - name: OMP_NUM_THREADS
          value: "16"
        # ---- engine start method --------------------------------------------
        # vllm serve overrides vLLM's own default here: envs.py:68 declares
        # "fork", but entrypoints/serve/utils/api_utils.py:164 sets "spawn"
        # whenever the variable is *unset* -- so setting it in the manifest is
        # what wins. Despite the name, TP=1 uses UniProcExecutor and has no
        # separate worker processes; what this actually changes is how
        # EngineCore is created (v1/engine/utils.py:139).
        #
        # The prize: a spawned EngineCore is a fresh interpreter that re-imports
        # the entire stack. On 20260901-191644-r2 it exec'd at t+20.0s and did
        # not reach engine.core_proc_init until t+35.5s -- 15.5s, 28% of a 55.3s
        # run, spent importing torch and vllm a second time. A forked child
        # inherits them already loaded.
        #
        # For the cross-pod CRIU arm specifically, fork here is a default for
        # the plain-boot control only: reports/criu-cuda-checkpoint.txt's
        # QUALIFICATION 1 established that a full-engine dump/restore requires
        # spawn (fork and CRIU are mutually exclusive -- a criu-restored
        # process has CUDA already initialised, so vLLM force-overrides fork
        # to spawn anyway; see system_utils.py _maybe_force_spawn). Set
        # VLLM_WORKER_MULTIPROC_METHOD=spawn on the exec line for any arm that
        # dumps a warmed engine, exactly as the original session did; leave it
        # at fork here only because this manifest's baseline boot (the "cold"
        # side of the comparison) should match pod A's baseline.
        #
        # The risk: the failure mode is a hang, not a crash. By fork time the
        # parent has imported torch and is multi-threaded, and Python 3.12 (this
        # image) warns that fork() in a multi-threaded process can deadlock the
        # child if any thread held a lock. vLLM force-reverts to spawn if CUDA
        # is already initialised in the parent (system_utils.py
        # _maybe_force_spawn), so the win can also disappear silently on a
        # version bump with no error -- check the trace, not the config. Unusable
        # with Ray, --numa-bind or WSL (all force spawn) and with multimodal
        # mm_tensor_ipc=torch_shm (hard error); Whisper warns about forked-worker
        # hangs. Python 3.14 moves the Linux default to forkserver, so treat this
        # as a measured shortcut with a shelf life.
        #
        # Do not set "forkserver" here -- not because it is the wrong idea but
        # because the value cannot work: api_server.py:108 has a branch for it,
        # yet envs.py:937 restricts the variable to spawn/fork, so
        # get_mp_context() raises ValueError and the feature dies right after
        # configuring itself. Use CS_FORKSERVER=1 instead
        # (coldstart/cs_forkserver.py), which hands get_mp_context a forkserver
        # context directly and arms the preload at t~0 so it overlaps this
        # process's own imports rather than blocking the first fork. Leave this
        # variable at "fork" for the baseline arm: if the probe declines -- CUDA
        # already initialised, Ray, --numa-bind, WSL -- the run then falls back
        # to a start method we have a number for, and forkserver.summary in the
        # trace says it happened.
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "fork"
        # ---- keep the baseline honest --------------------------------------
        # Usage telemetry is an outbound HTTPS POST on the startup path; leave
        # it off unless the experiment is specifically about it.
        - name: VLLM_NO_USAGE_STATS
          value: "1"
        - name: DO_NOT_TRACK
          value: "1"
        # ---- why HF offline mode is deliberately NOT set --------------------
        # Offline mode looks free: the weights are already on the PVC, so
        # skipping the hub round trips (574ms on the warm run) should be pure
        # win. It is not. vllm/engine/arg_utils.py:808 rewrites --model from the
        # repo id to the resolved snapshot directory whenever offline mode is on
        #   arg_utils.py:813 HF_HUB_OFFLINE is True, replace model_id
        #   [Qwen/Qwen2.5-1.5B-Instruct] to model_path [/cache/hf/hub/
        #   models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/989aa798...]
        # and that string is part of vLLM's torch.compile cache key, so the AOT
        # artifact cached under the repo id is never found. Run 20260901-185341
        # recompiled from scratch (compilation n=3/260ms -> n=91/12.5s,
        # kvcache.determine_memory 1.85s -> 12.9s) and took 65.7s against 53.0s
        # for the same warm PVC with these unset -- to buy back 574ms.
        # Both names matter: huggingface_hub derives HF_HUB_OFFLINE from either
        # variable (constants.py: _is_true(HF_HUB_OFFLINE or
        # TRANSFORMERS_OFFLINE)), so setting only TRANSFORMERS_OFFLINE triggers
        # the same rewrite. A path-keyed compile cache is also the wrong shape
        # for llm-d: the key then embeds the snapshot commit and the mount
        # point, so it stops being shareable across pods that mount the cache
        # elsewhere or re-resolve the model to a new snapshot dir.
        # - name: HF_HUB_OFFLINE
        #   value: "1"
        # - name: TRANSFORMERS_OFFLINE
        #   value: "1"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
      resources:
        limits:
          nvidia.com/gpu: "2"
          # CPU matters more than people expect: imports, safetensors handling
          # and Inductor compilation are CPU-bound, and a low limit shows up as
          # cgroup throttling in the report. Keep requests == limits so the
          # measurement is not at the mercy of neighbours.
          cpu: "16"
          # 384Gi, not the 128Gi the other manifests use, and this is a
          # criu-specific requirement rather than a serving one.
          # cuda-checkpoint does not write device memory to disk: it moves it
          # into the process's own anonymous pages, so RSS grows by the whole
          # device footprint. Measured on the small probe
          # (scripts/criu-matrix.sh): 2773 MiB on the GPU became RSS 0.66 ->
          # 3.30 GiB, i.e. essentially 1:1. An 80 GiB H100 running at
          # --gpu-memory-utilization 0.9 therefore needs ~72 GiB of host RAM per
          # GPU *before* criu writes anything, and TP=2 needs ~144 GiB -- more
          # than a 128Gi cgroup can hold, so the TP=2 park arm would be OOM
          # killed mid-checkpoint rather than producing a result.
          #
          # The headroom on top also keeps the dump measurement honest. criu
          # writes its image through the page cache, and in a tight cgroup those
          # dirty pages have to be written back and reclaimed while the parked
          # tree still holds its full RSS -- so the dump time would be measuring
          # reclaim pressure rather than the device (/criu sustains 649 MB/s
          # write, 3.9 GB/s read, O_DIRECT).
          #
          # This pod is the RESTORE side of the cross-pod arm and, per the
          # import-warm route this repo actually recommends
          # (reports/criu-cuda-checkpoint.txt, --stage server), likely never
          # needs anywhere near 384Gi -- that image is 0.59 GiB. The full 384Gi
          # is kept here anyway so this manifest can also run the full-engine
          # arm (recommendation 3, warm standby) without a second edit, and so
          # pod A and pod B are not confounded by differing resource shapes.
          memory: 384Gi
        requests:
          nvidia.com/gpu: "2"
          cpu: "16"
          memory: 384Gi
      volumeMounts:
        - name: probe
          mountPath: /opt/coldstart-src
          readOnly: true
        - name: cache
          mountPath: /cache
        - name: traces
          mountPath: /var/log/coldstart
        - name: shm
          mountPath: /dev/shm
        # Node-local nvme, kept for the same-pod nvme-vs-PVC comparison -- see
        # point 3a above. NOT where the cross-pod image lives; that is
        # /cache/criu-img, already reachable through the "cache" mount above --
        # see point 3. scripts/criu-preboot.sh's IMGROOT already defaults to
        # /criu/img; point it at /cache/criu-img instead with
        # `IMGROOT=/cache/criu-img bash criu-preboot.sh ...` (or
        # criu-vllm-probe.sh / criu-matrix.sh's own --img-dir / $IMGROOT), both
        # in pod A when dumping and pod B when restoring.
        - name: criu
          mountPath: /criu
      securityContext:
        # CRIU needs more than the restricted SCC gives. Specifically:
        #   * CAP_SYS_ADMIN / CAP_CHECKPOINT_RESTORE -- parasite injection,
        #     clone3(set_tid) to restore the original pids, /proc/*/map_files.
        #   * CAP_SYS_PTRACE  -- seize the tree.
        #   * seccomp Unconfined -- RuntimeDefault blocks kcmp(), which criu
        #     uses to decide whether two fds share a file, and userfaultfd.
        # docs/sleep-mode.md priced a CRIU image while noting the restricted pod
        # ("CapEff: 0000000000000000") could not test one. This manifest is that
        # test, and nothing else: it is not a serving shape.
        privileged: true
        allowPrivilegeEscalation: true
        capabilities:
          add: ["ALL"]
        seccompProfile:
          type: Unconfined
  volumes:
    - name: probe
      configMap:
        name: coldstart-probe
        defaultMode: 0555
    - name: cache
      persistentVolumeClaim:
        # RWO. See point 4 above: pod A (manifests/pod-exec-criu.yaml) must be
        # deleted before this claim can bind here. The two pods are sequential
        # arms of one experiment, never a concurrent pair.
        claimName: coldstart-cache
    # Traces are small (a few hundred KiB per run) and are pulled out with
    # `kubectl cp`; emptyDir keeps them off the shared cache volume.
    - name: traces
      emptyDir: {}
    # vLLM's multiprocess executor moves tensors through shared memory. The
    # 64 MiB default /dev/shm is a classic silent stall in TP>1 startup.
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    # Node-local disk, same rationale as pod-exec-criu.yaml: fast, but gone
    # the moment this pod is. Kept for in-pod nvme-vs-PVC comparisons only.
    # The volume that actually matters for this manifest's purpose --
    # /cache/criu-img -- is NOT a separate volume: it is a subdirectory that
    # scripts/criu-preboot.sh (via IMGROOT=/cache/criu-img) or an explicit
    # --img-dir creates on demand inside the "cache" PVC mount above. Mounting
    # the same PVC a second time at a path nested under its own first mount
    # point would not create a subdirectory view -- it would overlay the same
    # volume root a second time, which is confusing and unnecessary here since
    # /cache already reaches everything the PVC holds.
    - name: criu
      emptyDir: {}
