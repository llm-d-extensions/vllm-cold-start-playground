# Copy to hf-token-secret.yaml (git-ignored) and fill in, or create it with:
#   kubectl create secret generic hf-token --from-literal=token="$HF_TOKEN"
#
# The probe redacts anything that looks like a credential before writing it to a
# trace (env keys matching TOKEN|SECRET|PASSWORD|KEY|CRED|AUTH become
# "<redacted:N chars>"), so traces are safe to attach to an issue. Verify that
# for yourself before publishing one anyway.
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
type: Opaque
stringData:
  token: "hf_replace_me"
